    <script>
// 全新升级 高级宏大浪漫打字机文案
const introLines = [
'致我最珍贵的小星星：',
'',
'世间情话千万，皆不及我对你的万般真心。',
'人海浮沉，山河辽阔，',
'何其有幸，让我在最好的时光里遇见你。',
'',
'二零二六年八月六日，',
'是我们故事落笔的开篇，',
'是我心动定格的永远。',
'',
'我们隔山海、跨城市，',
'异地是考验，更是我们独有的浪漫。',
'',
'有人说，爱意会被距离冲淡，',
'但我偏要反其道而行，',
'越隔千里，越思念入骨，越笃定余生是你。',
'',
'One life, one love.',
'一生一世一双人，半醒半醉半余生。',
'',
'我想把人间所有温柔、星光、晚风、浪漫，',
'全部赠予独一无二的你。',
'',
'点击下方，开启属于我们的专属浪漫。'
];

const typeBox = document.getElementById('typeBox');
const cursorEl = document.querySelector('.cursor');
const signEl = document.getElementById('sign');
let lineIndex = 0;
let charIndex = 0;
const speed = 60;

function typeWrite(){
    if(lineIndex >= introLines.length){
        cursorEl.style.display = 'none';
        setTimeout(()=>{
            signEl.style.opacity = 1;
        },800);
        return;
    }
    const currLine = introLines[lineIndex];
< currLine.length){
        typeBox.innerText = currLine.substring(0,charIndex);
        charIndex++;
        setTimeout(typeWrite,speed);
    }else{
        typeBox.innerText += '\n';
        lineIndex++;
        charIndex = 0;
        setTimeout(typeWrite, 300);
    }
}

// 原版花瓣特效完全保留
function createPetal(){
    const p = document.createElement('div');
    p.className = 'petal';
    const size = Math.random()*12 +6;
    p.style.width = size+'px';
    p.style.height = size+'px';
    p.style.left = Math.random()*100 +'%';
    p.style.top = '-15px';
    const dur = Math.random()*7 +6;
    p.style.transition = `top ${dur}s linear, left ${dur}s ease-in-out`;
    document.body.appendChild(p);
    setTimeout(()=>{
        p.style.top = '105vh';
        p.style.left = (parseFloat(p.style.left)+(Math.random()*12-6))+'%';
    },30);
    setTimeout(()=>{p.remove();},dur*1000);
}
setInterval(createPetal,420);

// 弹窗开关函数
function openPop(id){
    document.getElementById(id).style.display='flex';
}
function closePop(id){
    document.getElementById(id).style.display='none';
}

// 背景音乐点击激活
document.body.addEventListener('click',()=>{
    const aud = document.getElementById('bgMusic');
    aud.play().catch(e=>{});
},{once:true});

window.onload = ()=>{
    typeWrite();
}
</script>
