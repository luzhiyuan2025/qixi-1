<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One life,one love</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0b0b1a;
            font-family: "Microsoft Yahei",serif;
            color: #fff;
            position: relative;
        }
        #videoBg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            opacity:0.35;
        }
        .petal {
            position: fixed;
            background-color: #ffb6c1;
            border-radius: 150% 0 150% 0;
            z-index: 99;
            pointer-events: none;
        }
        #typeBox{
            position:absolute;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%);
            max-width:620px;
            width:90%;
            font-size:22px;
            line-height:2;
            text-shadow: 0 0 12px #ffc0cb;
            white-space:pre-wrap;
        }
        .cursor{
            display:inline-block;
            width:10px;
            background:#ffc0cb;
            animation:blink 0.7s infinite;
        }
        @keyframes blink{
            0%,49%{opacity:1}
            50%,100%{opacity:0}
        }
        .modal-wrap{
            position:fixed;
            top:0;left:0;
            width:100%;height:100%;
            background:rgba(0,0,0,0.65);
            display:none;
            align-items:center;
            justify-content:center;
            z-index:200;
        }
        .modal{
            background:#14142b;
            border:1px solid #ff8fb3;
            padding:32px;
            max-width:540px;
            width:88%;
            border-radius:14px;
            box-shadow: 0 0 30px #ff6b9c60;
        }
        .modal h3{
            color:#ffc8da;
            margin-bottom:16px;
        }
        .modal p{
            line-height:1.8;
            font-size:16px;
            color:#f8e8ef;
        }
        .btn-group{
            margin-top:24px;
            display:flex;
            gap:14px;
            justify-content:center;
        }
        button{
            padding:9px 22px;
            border:1px solid #ff8fb3;
            background:transparent;
            color:#ffd2e0;
            border-radius:8px;
            cursor:pointer;
            transition:0.25s;
        }
        button:hover{
            background:#ff6b9c33;
        }
        #sign{
            position:absolute;
            bottom:40px;
            right:45px;
            font-size:17px;
            color:#ffc8da;
            text-shadow:0 0 8px #ff8fb3;
            opacity:0;
        }
    </style>
</head>
<body>
    <video id="videoBg" loop muted autoplay>
        <source src="./粒子玫瑰.mp4" type="video/mp4">
    </video>

    <div id="typeBox"></div>
    <span class="cursor"> </span>

    <div class="modal-wrap" id="m1">
        <div class="modal">
            <h3>关于我们</h3>
            <p>跨越山海的距离，我们在八月六日，正式属于彼此。<br>这是我们一同度过的第一个七夕。<br>纵然相隔两地，思念却从未被距离冲淡。每一通电话，每一句碎碎念，都是独属于我们的浪漫。</p>
            <div class="btn-group">
                <button onclick="closeModal('m1')">记下这份温柔</button>
            </div>
        </div>
    </div>

    <div class="modal-wrap" id="m2">
        <div class="modal">
            <h3>心底告白</h3>
            <p>One life,one love。<br>人的一生，只为一份挚爱奔赴。<br>我会接住你的不安，包容你的小情绪，把满心的偏爱慢慢交付给你。<br>往后朝朝暮暮，期待和你把所有期待慢慢变成现实。</p>
            <div class="btn-group">
                <button onclick="closeModal('m2')">藏进心里</button>
            </div>
        </div>
    </div>

    <div class="modal-wrap" id="m3">
        <div class="modal">
            <h3>期许</h3>
            <p>星星可以跨越夜空相见，我们也终会跨过异地相逢。<br>愿我们岁岁相伴，爱意长久，把每一个平凡日子都酿成温柔。</p>
            <div class="btn-group">
                <button onclick="closeModal('m3')">满怀期待</button>
            </div>
        </div>
    </div>

    <div id="sign">——予我的女孩</div>

    <audio id="bgMusic" loop>
        <source src="./music.mp3">
    

<script>
// ======================仅这里修改文案，符号不要改动======================
const introLines = [
'我亲爱的女孩——',
'有一份藏了很久的心意，想在我们的第一个七夕讲给你听。',
'',
'八月六日，是我们故事新的起点。',
'隔着遥远的两地，我们确认了彼此。',
'',
'很多心里话，电话里会被噪音吞没，紧张时又会堵在喉咙。',
'所以把思念写在这里，慢慢说给你。',
'',
'One life,one love。',
'一生，唯爱一人。',
'',
'异地会拉开空间的距离，却拉不开心里的牵挂。',
'你的欢喜、你的敏感、你的小脾气，我全都好好收好。',
'',
'点击下方，开启三段心里话。',
'【1】关于我们',
'【2】心底告白',
'【3】期许',
'',
'等待花瓣缓缓落下。'
];
// ======================================================================

const typeBox = document.getElementById('typeBox');
const cursorEl = document.querySelector('.cursor');
const signEl = document.getElementById('sign');
let lineIndex = 0;
let charIndex = 0;
const speed = 65;

function typeWrite(){
    if(lineIndex >= introLines.length){
        cursorEl.style.display = 'none';
        setTimeout(()=>{
            document.getElementById('m1').style.display='flex';
        },1200);
        setTimeout(()=>{
            signEl.style.opacity = 1;
        },2200);
        return;
    }
    const currLine = introLines[lineIndex];
    if(charIndex < currLine.length){
        typeBox.innerText = currLine.substring(0,charIndex);
        charIndex++;
        setTimeout(typeWrite,speed);
    }else{
        typeBox.innerText += '\n';
        lineIndex++;
        charIndex = 0;
        setTimeout(typeWrite, 280);
    }
}

//花瓣飘落
function createPetal(){
    const p = document.createElement('div');
    p.className = 'petal';
    const size = Math.random()*12 +6;
    p.style.width = size+'px';
    p.style.height = size+'px';
    p.style.left = Math.random()*100 +'%';
    p.style.top = '-15px';
    const dur = Math.random()*7 +6;
    p.style.transition = `top ${dur}s linear, left ${dur}s ease-in-out`;
    document.body.appendChild(p);
    setTimeout(()=>{
        p.style.top = '105vh';
        p.style.left = (parseFloat(p.style.left)+(Math.random()*12-6))+'%';
    },30);
    setTimeout(()=>{p.remove();},dur*1000);
}
setInterval(createPetal,420);

function closeModal(id){
    document.getElementById(id).style.display='none';
    if(id==='m1') setTimeout(()=>{document.getElementById('m2').style.display='flex'},600);
    else if(id==='m2') setTimeout(()=>{document.getElementById('m3').style.display='flex'},600);
}

//音乐交互
document.body.addEventListener('click',()=>{
    const aud = document.getElementById('bgMusic');
    aud.play().catch(e=>{});
},{once:true});

window.onload = ()=>{
    typeWrite();
}
</script>
</body>
</html>
